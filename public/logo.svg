<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

  <!-- Monogram B & Lightning POS Mark -->
  <g filter="url(#shadow)">
    <!-- Main Letter B Vertical Stem -->
    <path d="M38 28 H66 C78 28 86 34 86 44 C86 51 81 57 74 59 C83 61 90 68 90 78 C90 90 80 98 66 98 H38 C34.686 98 32 95.314 32 92 V34 C32 30.686 34.686 28 38 28 Z" fill="#ffffff" />
    
    <!-- Cutouts for B -->
    <path d="M46 40 V54 H64 C68.418 54 72 50.418 72 47 C72 43.582 68.418 40 64 40 H46 Z" fill="url(#bgGrad)" />
    <path d="M46 66 V86 H66 C70.971 86 75 81.971 75 76 C75 70.029 70.971 66 66 66 H46 Z" fill="url(#bgGrad)" />
    
    <!-- Dynamic Lightning / Smart Billing Bolt Accent -->
    <path d="M84 22 L72 46 H86 L68 76 L74 52 H62 Z" fill="url(#goldGrad)" stroke="#1d4ed8" stroke-width="1.5" />
  </g>
</svg>
